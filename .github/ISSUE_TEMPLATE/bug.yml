name: 🐛 Bug Report
description: Report a bug or issue in the hackathon project
title: "[BUG] "
labels: ["bug"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please provide as much detail as possible to help us reproduce and fix the issue.

  - type: textarea
    id: bug-description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is
      placeholder: Describe what went wrong
    validations:
      required: true

  - type: textarea
    id: reproduction-steps
    attributes:
      label: Steps to Reproduce
      description: Detailed steps to reproduce the behavior
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: A clear description of what you expected to happen
      placeholder: What should have happened instead?
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual Behavior
      description: A clear description of what actually happened
      placeholder: What actually happened?
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: How severe is this bug?
      options:
        - Critical (Blocks core functionality)
        - High (Major feature broken)
        - Medium (Minor feature issue)
        - Low (Cosmetic or edge case)
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How urgent is this fix for the hackathon?
      options:
        - Critical (Must fix before demo)
        - High (Should fix soon)
        - Medium (Fix when possible)
        - Low (Fix later)
    validations:
      required: true

  - type: checkboxes
    id: environment
    attributes:
      label: Environment
      description: Select all that apply
      options:
        - label: Frontend (React/TypeScript)
        - label: Backend (Python)
        - label: Backend (Go)
        - label: Database
        - label: Docker/Deployment
        - label: GitHub Integration
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser (if frontend issue)
      description: Which browser are you using?
      placeholder: "Chrome 120, Firefox 121, Safari 17, etc."
    validations:
      required: false

  - type: input
    id: os
    attributes:
      label: Operating System
      description: Which OS are you using?
      placeholder: "Windows 11, macOS 14, Ubuntu 22.04, etc."
    validations:
      required: false

  - type: textarea
    id: screenshots-logs
    attributes:
      label: Screenshots and Logs
      description: |
        Add screenshots, error messages, or log outputs that help explain the problem.
        Tip: You can attach images by clicking this area to highlight it and then dragging files in.
      placeholder: |
        Console errors:
        ```
        Error message here
        ```
        
        Server logs:
        ```
        Log output here
        ```
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context about the problem here
      placeholder: Any other information that might be relevant
    validations:
      required: false