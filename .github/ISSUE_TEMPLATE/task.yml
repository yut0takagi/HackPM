name: 📋 General Task
description: Create a general task or improvement for the hackathon project
title: "[TASK] "
labels: ["task"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Use this template for general tasks, improvements, documentation, or other work items that don't fit the feature or bug categories.

  - type: textarea
    id: task-description
    attributes:
      label: Task Description
      description: Clearly describe what needs to be done
      placeholder: What is the goal of this task?
    validations:
      required: true

  - type: dropdown
    id: task-category
    attributes:
      label: Task Category
      description: What type of task is this?
      options:
        - Documentation
        - Refactoring
        - Performance Improvement
        - Security Enhancement
        - Testing
        - DevOps/Infrastructure
        - Research/Investigation
        - Configuration
        - Other
    validations:
      required: true

  - type: textarea
    id: task-checklist
    attributes:
      label: Task Checklist
      description: Break down the task into specific actionable items
      placeholder: |
        - [ ] Step 1: Do something
        - [ ] Step 2: Do something else
        - [ ] Step 3: Verify the result
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: List any issues, tasks, or external dependencies that must be completed first
      placeholder: |
        - Depends on issue #123
        - Requires API key setup
        - Needs database migration
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this task for the hackathon?
      options:
        - Critical (Blocks other work)
        - High (Important for demo)
        - Medium (Should be done)
        - Low (Nice to have)
    validations:
      required: true

  - type: dropdown
    id: estimated-time
    attributes:
      label: Estimated Completion Time
      description: How long do you think this will take?
      options:
        - 30 minutes
        - 1-2 hours
        - 3-4 hours
        - 5-8 hours
        - 1 day
        - 2+ days
    validations:
      required: true

  - type: input
    id: assignee-suggestion
    attributes:
      label: Suggested Assignee
      description: Who would be best suited for this task? (GitHub username)
      placeholder: "@username"
    validations:
      required: false

  - type: input
    id: milestone
    attributes:
      label: Milestone/Sprint
      description: Which milestone or sprint should this be part of?
      placeholder: "Sprint 1, Demo Prep, etc."
    validations:
      required: false

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Definition of Done
      description: How will we know this task is complete?
      placeholder: |
        - All checklist items are completed
        - Code is reviewed and merged
        - Documentation is updated
        - Tests pass
    validations:
      required: false

  - type: textarea
    id: additional-notes
    attributes:
      label: Additional Notes
      description: Any other relevant information, links, or context
      placeholder: Links to documentation, examples, or related resources
    validations:
      required: false