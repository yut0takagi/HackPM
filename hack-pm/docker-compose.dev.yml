services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend-python
    restart: unless-stopped
    environment:
      - NODE_ENV=development

  backend-python:
    build:
      context: ./backend-python
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend-python:/app
      - ./data:/app/data
      - /app/venv  # Exclude venv from volume mount
    env_file:
      - .env
    environment:
      - PORT=8000
      - DATABASE_URL=sqlite:///./data/hack_pm.db
      - PYTHONPATH=/app/src
      - ENVIRONMENT=development
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

volumes:
  data:
    driver: local