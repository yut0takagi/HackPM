services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:9000
    depends_on:
      - backend-python
    restart: unless-stopped

  backend-python:
    build:
      context: ./backend-python
      dockerfile: Dockerfile
    ports:
      - "9000:9000"
    volumes:
      - ./backend-python:/app
      - ./hack_pm.db:/app/hack_pm.db
    env_file:
      - .env
    environment:
      - PORT=9000
      - DATABASE_URL=sqlite:///./hack_pm.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped