services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend-python
    restart: unless-stopped

  backend-python:
    build:
      context: ./backend-python
      dockerfile: Dockerfile
    ports:
      - "9000:9000"
    volumes:
      - ./backend-python:/app
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - PORT=9000
      - DATABASE_URL=sqlite:///./data/hack_pm.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Optional: Keep Go backend for legacy support
  backend-go:
    build:
      context: ./backend-go
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./backend-go:/app
    environment:
      - PORT=8080
      - PYTHON_API_URL=http://backend-python:9000
    depends_on:
      - backend-python
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    profiles:
      - legacy